<!doctype html>
<!--
  DEWI · office-v3.html — 3D-kantoor (PROTOTYPE, 12-11-2026; detailronde 2)
  ----------------------------------------------------------------------
  Eén verdieping in echte 3D (three.js r187, lokaal in office-v3-assets/, gescand):
  afdelingen tegen elkaar met gangen, hoge buitenmuren met grote ramen en invallend daglicht,
  per afdeling dichte achterwanden met wanddecoratie (grafieken e.d.), props (waterdispenser,
  kopieerapparaat, kasten, prullenbakken, koffiekopjes, planten), een vergadertafel voor 8 op het
  plein, de zwevende Brain uit office-v2 (brain-core.mp4) en vuurballetjes agent <-> Brain.
  Balinees: gong (klinkt bij een online order), tedung-parasols, candi bentar-poort, wachters met
  poleng, penjor, frangipani, canang sari op bureaus met 7 dagen 100% succes, gesneden deurkozijnen.
  office-v2.html blijft ongewijzigd bestaan.

  Data (anon-key, alleen lezen): v_office_depts, v_office_agents, dewi_runs_stats_7d,
  dewi_runs_public (bij gekozen agent). Ingelogd (supabase-js-sessie, RLS): bridge_open_orders
  (source_name = web) voor de gong — zelfde regel als office-v2.

  Opbouw: statische blokjes in InstancedMesh BX, bewegende armen in ARM, schermen/lampjes in SCR,
  glas in GL. Elke werkplek/prop heeft een lokaal assenstelsel (voorkant = +z); wandprops staan met
  de rug (z=0) tegen de wand. layout() = indeling; furnishRoom() = wanden, bureaus, wandslots.
  Overleg: 3+ agents met een nieuwe run in dezelfde verversing lopen naar de vergadertafel,
  zitten ±25 s en lopen terug (meeting()). Daglicht: onzichtbaar dak werpt schaduw.
  Test zonder Supabase: office-v3.html?demo=1 (toont na enkele seconden een overleg en een order).
-->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './office-v3-assets/OrbitControls.js';

const CFG = window.DEWI_CONFIG || {};
const SB_URL = CFG.SUPABASE_URL || 'https://jucubuoftjehwancegma.supabase.co';
const SB_KEY = CFG.SUPABASE_ANON_KEY || '';
const N8N = 'https://homedecobali.app.n8n.cloud/workflow/';
const ASSETS2 = 'office-v2-assets/';
const DEMO = /[?&]demo=1/.test(location.search);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- data ---------- */
function rest(path) {
  return fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then((r) => { if (!r.ok) throw new Error(path.split('?')[0] + ' ' + r.status); return r.json(); });
}
function demoData() {
  const D = [['MANAGEMENT', '#ffd166', 5], ['META', '#ff3f9a', 11], ['GOOGLE ADS', '#4285f4', 6], ['SOCIAL', '#a78bfa', 27], ['PINTEREST', '#bd081c', 9], ['PLATFORM', '#38bdf8', 17], ['CATALOGUS & CONTENT', '#22c55e', 8], ['MARKETING', '#e31e24', 12], ['DATA & INZICHT', '#f97316', 5], ['OFFICE', '#06b6d4', 7], ['CUSTOMER SERVICE', '#14b8a6', 5]];
  const depts = [], agents = [], stats = [];
  D.forEach((d, i) => {
    depts.push({ dept_name: d[0], dept_color: d[1], dept_sort: i + 1 });
    for (let k = 0; k < d[2]; k++) {
      const h = (i * 31 + k * 17) % 23, wf = 'HDB · DEMO · ' + i + '-' + k;
      agents.push({ agent_id: 'demo-' + i + '-' + k, agent_name: 'Agent ' + (k + 1), workflow_name: wf, n8n_workflow_id: 'x', dept_name: d[0], dept_sort: i + 1, agent_sort: k, schedule_human: 'Dagelijks 08:00', paused: false, last_run_at: new Date(Date.now() - h * 3600e3).toISOString(), last_success: h !== 7, last_summary: 'Demo-run', runs_24h: h % 5, fails_24h: 0, open_loops: 0, state: h === 7 ? 'error' : h === 3 ? 'working' : h === 11 ? 'idle' : 'ok' });
      if (h % 3 === 0) stats.push({ workflow: wf, runs_7d: 7, ok_7d: 7, pct_ok: 100 });
    }
  });
  return Promise.resolve({ depts, agents, stats });
}
function fetchAll() {
  if (DEMO) return demoData();
  return Promise.all([
    rest('v_office_depts?select=dept_name,dept_color,dept_sort&order=dept_sort'),
    rest('v_office_agents?select=*'),
    rest('dewi_runs_stats_7d?select=workflow,runs_7d,ok_7d,pct_ok').catch(() => [])
  ]).then(([depts, agents, stats]) => ({ depts, agents, stats }));
}

/* ---------- three basis ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.insertBefore(renderer.domElement, stage.firstChild);
renderer.domElement.setAttribute('aria-label', 'DEWI kantoor in 3D');
renderer.domElement.setAttribute('role', 'img');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 400);
const HOME = { pos: new THREE.Vector3(36, 42, 50), tgt: new THREE.Vector3(0, 1.5, 2) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 130;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.22;
controls.update();

scene.add(new THREE.HemisphereLight(0xe6f0ff, 0xa9a297, 0.95));
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(30, 40, 35); scene.add(fill);
const sun = new THREE.DirectionalLight(0xffe9bd, 5.5);
sun.position.set(-48, 23, -36); sun.target.position.set(0, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -44; sc.right = 44; sc.top = 38; sc.bottom = -38; sc.near = 5; sc.far = 150;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const W = 50, D = 40, HX = W / 2, HZ = D / 2, COR = 2.6, WALL_H = 5.0, IW_H = 3.4, PLZ = 11;
const BRAIN_Y = 10.8;
const ENTRY_Z = -HZ + 2 * (D - 2 * COR) / 3 + COR * 1.5; // midden van de voorste gang

/* ---------- blokjes ---------- */
const CAP = 22000, ACAP = 600, SCAP = 1500, GCAP = 1600;
const unitBox = new THREE.BoxGeometry(1, 1, 1);
let root, BX, ARM, SCR, GL, bxN, armN, scrN, glN, owner, ownerA, agentsRt, rooms, structKey = '';
const M = new THREE.Matrix4(), M2 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S3 = new THREE.Vector3(), C = new THREE.Color();
const IDENT = new THREE.Matrix4(), YAX = new THREE.Vector3(0, 1, 0);

function compose(base, x, y, z, sx, sy, sz) {
  M2.compose(V.set(x, y, z), Q.identity(), S3.set(sx, sy, sz));
  return M.multiplyMatrices(base || IDENT, M2);
}
function box(base, x, y, z, sx, sy, sz, color, own) {
  if (bxN >= CAP) return -1;
  BX.setMatrixAt(bxN, compose(base, x, y, z, sx, sy, sz));
  BX.setColorAt(bxN, C.set(color));
  owner[bxN] = own == null ? -1 : own;
  return bxN++;
}
function led(base, x, y, z, sx, sy, sz, color) { if (scrN >= SCAP) return -1; SCR.setMatrixAt(scrN, compose(base, x, y, z, sx, sy, sz)); SCR.setColorAt(scrN, C.set(color)); return scrN++; }
function glass(base, x, y, z, sx, sy, sz) { if (glN < GCAP) GL.setMatrixAt(glN++, compose(base, x, y, z, sx, sy, sz)); }
function frame(x, z, yaw) { return new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion().setFromAxisAngle(YAX, yaw || 0), new THREE.Vector3(1, 1, 1)); }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function tint(hex, toWhite) { return '#' + new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), toWhite).getHexString(); }

/* ---------- indeling ---------- */
function needW(n) { return Math.max(6.5, Math.ceil(n / 4) * 1.95 + 2.6); }
function layout(depts) {
  const RD = (D - 2 * COR) / 3;
  const zr = [-HZ, -HZ + RD + COR, -HZ + 2 * (RD + COR)];
  const bySize = depts.slice().sort((a, b) => b.n - a.n || a.sort - b.sort);
  const mid = bySize.slice(0, 2).sort((a, b) => a.sort - b.sort);
  const rest = depts.filter((d) => mid.indexOf(d) < 0).sort((a, b) => a.sort - b.sort);
  const top = [], bot = []; let st = 0, sb = needW(6) + COR;
  rest.forEach((d) => { if (st <= sb) { top.push(d); st += needW(d.n) + COR; } else { bot.push(d); sb += needW(d.n) + COR; } });
  bot.push({ name: 'KANTINE', color: '#e0a458', n: 0, canteen: true, sort: 999 });
  const out = [];
  function row(list, z0, door, rowId) {
    const avail = W - (list.length - 1) * COR;
    const mins = list.map((d) => d.canteen ? needW(6) : needW(d.n));
    const sum = mins.reduce((a, b) => a + b, 0);
    let x = -HX;
    list.forEach((d, i) => {
      const w = sum > avail ? mins[i] * avail / sum : mins[i] + (avail - sum) * (mins[i] / sum);
      out.push({ d, x0: x, x1: x + w, z0, z1: z0 + RD, door, row: rowId });
      x += w + COR;
    });
  }
  row(top, zr[0], 's', 0); row(bot, zr[2], 'n', 2);
  const seg = (W - PLZ - 2 * COR) / 2;
  if (mid[0]) out.push({ d: mid[0], x0: -HX, x1: -HX + seg, z0: zr[1], z1: zr[1] + RD, door: 'e', row: 1 });
  if (mid[1]) out.push({ d: mid[1], x0: HX - seg, x1: HX, z0: zr[1], z1: zr[1] + RD, door: 'w', row: 1 });
  return out;
}

/* ---------- werkplek ---------- */
const SKIN = ['#f2c9a0', '#e8b88a', '#c98f62', '#8d5a3b', '#f6d7b8'];
const HAIR = ['#2b2118', '#5a3a22', '#b5532a', '#d9b25a', '#1c1c20', '#8a8f98'];
const SCREEN = { working: '#9ffcff', ok: '#49c6d8', error: '#ff4d4d', silent: '#f0b23c', paused: '#1c2430', idle: '#1c2430' };
function present(a) { return a.state !== 'paused' && a.state !== 'idle'; }

function canang(b, x, y, z, own) { // Balinees offertje
  box(b, x, y + 0.012, z, 0.16, 0.024, 0.16, '#5c8a3a', own);
  box(b, x - 0.035, y + 0.035, z - 0.035, 0.06, 0.03, 0.06, '#f4d03f', own); box(b, x + 0.035, y + 0.035, z - 0.035, 0.06, 0.03, 0.06, '#e84393', own);
  box(b, x - 0.035, y + 0.035, z + 0.035, 0.06, 0.03, 0.06, '#ffffff', own); box(b, x + 0.035, y + 0.035, z + 0.035, 0.06, 0.03, 0.06, '#7d3c98', own);
}
function station(a, idx, x, z, yaw, dept, star) {
  const b = frame(x, z, yaw), h = hash(a.agent_id), dc = dept.color;
  // bureau: blad, poten, ladeblok, pc
  box(b, 0, 0.75, 0.78, 1.7, 0.06, 0.85, '#dcbb8d', idx); box(b, 0, 0.715, 0.78, 1.6, 0.02, 0.78, '#b8996d', idx);
  box(b, -0.8, 0.36, 0.78, 0.06, 0.72, 0.78, '#2a2f3a', idx); box(b, 0.8, 0.36, 0.78, 0.06, 0.72, 0.78, '#2a2f3a', idx);
  box(b, 0, 0.5, 1.17, 1.56, 0.36, 0.03, '#b8996d', idx);
  box(b, 0.5, 0.33, 0.8, 0.42, 0.6, 0.6, '#cfd5de', idx);
  [0.52, 0.33, 0.14].forEach((y) => { box(b, 0.5, y, 0.495, 0.36, 0.015, 0.02, '#7c8798', idx); box(b, 0.5, y + 0.08, 0.492, 0.12, 0.025, 0.03, '#5b6475', idx); });
  box(b, -0.55, 0.22, 0.9, 0.2, 0.44, 0.44, '#20242e', idx); led(b, -0.55, 0.38, 0.675, 0.03, 0.03, 0.012, present(a) ? '#4fd1a1' : '#30363f');
  // scherm(en)
  const dual = h % 5 === 0, mx = dual ? -0.2 : 0;
  box(b, mx, 0.8, 1.04, 0.26, 0.03, 0.18, '#2a2f3a', idx); box(b, mx, 0.9, 1.06, 0.06, 0.2, 0.05, '#2a2f3a', idx);
  box(b, mx, 1.19, 1.04, 0.76, 0.48, 0.05, '#20242e', idx);
  const scr = led(b, mx, 1.19, 1.011, 0.7, 0.42, 0.012, SCREEN[a.state] || SCREEN.ok);
  if (dual) { box(b, 0.52, 0.9, 1.0, 0.05, 0.2, 0.05, '#2a2f3a', idx); box(b, 0.52, 1.16, 0.98, 0.5, 0.4, 0.05, '#20242e', idx); led(b, 0.52, 1.16, 0.951, 0.45, 0.34, 0.012, '#2a6f86'); }
  if (h % 3 === 1) box(b, mx + 0.3, 1.36, 1.008, 0.1, 0.1, 0.012, '#ffe066', idx);
  // toetsenbord, muis, spullen
  box(b, mx, 0.79, 0.6, 0.46, 0.02, 0.16, '#2a2f3a', idx); box(b, mx, 0.803, 0.6, 0.42, 0.006, 0.12, '#444b59', idx);
  box(b, mx + 0.36, 0.795, 0.6, 0.06, 0.03, 0.1, '#e9edf2', idx);

  const h1 = ray.intersectObject(BX, false)[0], h2 = ray.intersectObject(ARM, false)[0];
  let hit = h1, own = owner; if (h2 && (!h1 || h2.distance < h1.distance)) { hit = h2; own = ownerA; }
  if (gh && (!hit || gh.distance < hit.distance)) return { gong: true };
