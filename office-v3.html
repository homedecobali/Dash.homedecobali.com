<!doctype html>
<!--
  DEWI · office-v3.html — 3D-kantoor (PROTOTYPE, 12-11-2026)
  ----------------------------------------------------------------------
  Eén verdieping in echte 3D (three.js r187, lokaal in office-v3-assets/, gescand):
  alle afdelingen tegen elkaar met gangen ertussen, ramen in de buitenmuren met
  invallend daglicht, een zwevende Brain boven het plein en vuurballetjes tussen
  agents en Brain. office-v2.html blijft ongewijzigd bestaan.

  Data (anon-key, alleen lezen — dezelfde views als office-v2):
    v_office_depts      afdelingen (naam, kleur, volgorde)
    v_office_agents     agents + status (working / ok / error / silent / paused / idle)
    dewi_runs_stats_7d  7-daags succes per workflow
    dewi_runs_public    laatste runs (alleen bij een gekozen agent)

  Opbouw: alles wat een blokje is zit in ÉÉN InstancedMesh (BX), schermen in een
  tweede (SCR), glas in een derde (GL). Elke werkplek heeft een eigen lokaal assenstelsel
  (agent zit op de oorsprong en kijkt naar +z); station() zet bureau, stoel, scherm en poppetje.
  Indeling: layout() — 3 rijen kamers, de twee grootste afdelingen links/rechts van het plein.
  Daglicht: een onzichtbaar dak werpt schaduw, zodat de zon alleen door de ramen binnenvalt.
  Vuurballetjes: achtergrondactiviteit gewogen naar runs 24u; een NIEUWE run (last_run_at
  veranderd sinds de vorige verversing) geeft een salvo.
  Test zonder Supabase: office-v3.html?demo=1
-->

<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './office-v3-assets/OrbitControls.js';

const CFG = window.DEWI_CONFIG || {};
const SB_URL = CFG.SUPABASE_URL || 'https://jucubuoftjehwancegma.supabase.co';
const SB_KEY = CFG.SUPABASE_ANON_KEY || '';
const N8N = 'https://homedecobali.app.n8n.cloud/workflow/';
const DEMO = /[?&]demo=1/.test(location.search);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- data ---------- */
function rest(path) {
  return fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then((r) => { if (!r.ok) throw new Error(path.split('?')[0] + ' ' + r.status); return r.json(); });
}
function demoData() {
  const D = [['MANAGEMENT', '#ffd166', 5], ['META', '#ff3f9a', 11], ['GOOGLE ADS', '#4285f4', 6], ['SOCIAL', '#a78bfa', 27], ['PINTEREST', '#bd081c', 9], ['PLATFORM', '#38bdf8', 17], ['CATALOGUS & CONTENT', '#22c55e', 8], ['MARKETING', '#e31e24', 12], ['DATA & INZICHT', '#f97316', 5], ['OFFICE', '#06b6d4', 7], ['CUSTOMER SERVICE', '#14b8a6', 5]];
  const depts = [], agents = [];
  D.forEach((d, i) => {
    depts.push({ dept_name: d[0], dept_color: d[1], dept_sort: i + 1 });
    for (let k = 0; k < d[2]; k++) {
      const h = (i * 31 + k * 17) % 23;
      agents.push({ agent_id: 'demo-' + i + '-' + k, agent_name: 'Agent ' + (k + 1), workflow_name: 'HDB · DEMO · ' + i + '-' + k, n8n_workflow_id: 'x', dept_name: d[0], dept_sort: i + 1, agent_sort: k, schedule_human: 'Dagelijks 08:00', paused: false, last_run_at: new Date(Date.now() - h * 3600e3).toISOString(), last_success: h !== 7, last_summary: 'Demo-run', runs_24h: h % 5, fails_24h: 0, open_loops: 0, state: h === 7 ? 'error' : h === 3 ? 'working' : h === 11 ? 'idle' : 'ok' });
    }
  });
  return Promise.resolve({ depts, agents, stats: [] });
}
function fetchAll() {
  if (DEMO) return demoData();
  return Promise.all([
    rest('v_office_depts?select=dept_name,dept_color,dept_sort&order=dept_sort'),
    rest('v_office_agents?select=*'),
    rest('dewi_runs_stats_7d?select=workflow,runs_7d,ok_7d,pct_ok').catch(() => [])
  ]).then(([depts, agents, stats]) => ({ depts, agents, stats }));
}

/* ---------- three basis ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.insertBefore(renderer.domElement, stage.firstChild);
renderer.domElement.setAttribute('aria-label', 'DEWI kantoor in 3D');
renderer.domElement.setAttribute('role', 'img');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 400);
const HOME = { pos: new THREE.Vector3(34, 37, 47), tgt: new THREE.Vector3(0, 1.5, 2) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 12; controls.maxDistance = 130;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.18;
controls.update();

/* licht: hemel + invulling zonder schaduw, zon met schaduw (komt van achter-links, door de ramen) */
scene.add(new THREE.HemisphereLight(0xe6f0ff, 0xa9a297, 0.95));
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(30, 40, 35); scene.add(fill);
const sun = new THREE.DirectionalLight(0xffe9bd, 5.5);
sun.position.set(-48, 21, -36); sun.target.position.set(0, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -42; sc.right = 42; sc.top = 36; sc.bottom = -36; sc.near = 5; sc.far = 140;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const W = 50, D = 40, HX = W / 2, HZ = D / 2, COR = 2.6, WALL_H = 3.2;
const BRAIN_Y = 8.6;

/* ---------- blokjes: één InstancedMesh ---------- */
const CAP = 9000;
const unitBox = new THREE.BoxGeometry(1, 1, 1);
let root, BX, SCR, GL, bxN, scrN, glN, owner, agentsRt, rooms, deptLabels, structKey = '';
const M = new THREE.Matrix4(), M2 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S3 = new THREE.Vector3(), C = new THREE.Color();
const IDENT = new THREE.Matrix4();

function compose(base, x, y, z, sx, sy, sz) {
  M2.compose(V.set(x, y, z), Q.identity(), S3.set(sx, sy, sz));
  return M.multiplyMatrices(base || IDENT, M2);
}
function box(base, x, y, z, sx, sy, sz, color, own) {
  if (bxN >= CAP) return -1;
  BX.setMatrixAt(bxN, compose(base, x, y, z, sx, sy, sz));
  BX.setColorAt(bxN, C.set(color));
  owner[bxN] = own == null ? -1 : own;
  return bxN++;
}
function glass(x, y, z, sx, sy, sz) { if (glN < 1200) { GL.setMatrixAt(glN++, compose(null, x, y, z, sx, sy, sz)); } }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function tint(hex, toWhite) { return '#' + C.set(hex).lerp(new THREE.Color('#ffffff'), toWhite).getHexString(); }

/* ---------- indeling ---------- */
function needW(n) { return Math.max(6.5, Math.ceil(n / 4) * 1.95 + 2.6); }
function layout(depts) {
  const RD = (D - 2 * COR) / 3;
  const zr = [-HZ, -HZ + RD + COR, -HZ + 2 * (RD + COR)];
  const bySize = depts.slice().sort((a, b) => b.n - a.n || a.sort - b.sort);
  const mid = bySize.slice(0, 2).sort((a, b) => a.sort - b.sort);
  const rest = depts.filter((d) => mid.indexOf(d) < 0).sort((a, b) => a.sort - b.sort);
  const top = [], bot = []; let st = 0, sb = needW(6) + COR;
  rest.forEach((d) => { if (st <= sb) { top.push(d); st += needW(d.n) + COR; } else { bot.push(d); sb += needW(d.n) + COR; } });
  bot.push({ name: 'KANTINE', color: '#e0a458', n: 0, canteen: true, sort: 999 });
  const out = [];
  function row(list, z0, door) {
    const avail = W - (list.length - 1) * COR;
    const mins = list.map((d) => d.canteen ? needW(6) : needW(d.n));
    const sum = mins.reduce((a, b) => a + b, 0);
    let x = -HX;
    list.forEach((d, i) => {
      const w = sum > avail ? mins[i] * avail / sum : mins[i] + (avail - sum) * (mins[i] / sum);
      out.push({ d, x0: x, x1: x + w, z0, z1: z0 + RD, door });
      x += w + COR;
    });
  }
  row(top, zr[0], 's'); row(bot, zr[2], 'n');
  const PLZ = 11, seg = (W - PLZ - 2 * COR) / 2;
  if (mid[0]) out.push({ d: mid[0], x0: -HX, x1: -HX + seg, z0: zr[1], z1: zr[1] + RD, door: 'e' });
  if (mid[1]) out.push({ d: mid[1], x0: HX - seg, x1: HX, z0: zr[1], z1: zr[1] + RD, door: 'w' });
  return out;
}

/* ---------- werkplek ---------- */
const SKIN = ['#f2c9a0', '#e8b88a', '#c98f62', '#8d5a3b', '#f6d7b8'];
const HAIR = ['#2b2118', '#5a3a22', '#b5532a', '#d9b25a', '#1c1c20', '#8a8f98'];
const SCREEN = { working: '#9ffcff', ok: '#49c6d8', error: '#ff4d4d', silent: '#f0b23c', paused: '#1c2430', idle: '#1c2430' };
function present(a) { return a.state !== 'paused' && a.state !== 'idle'; }

function station(a, idx, x, z, yaw, deptColor) {
  const base = new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw), new THREE.Vector3(1, 1, 1));
  const h = hash(a.agent_id);
  // bureau
  box(base, 0, 0.75, 0.78, 1.7, 0.06, 0.85, '#dcbb8d', idx);
  box(base, -0.8, 0.36, 0.78, 0.06, 0.72, 0.78, '#2a2f3a', idx);
  box(base, 0.8, 0.36, 0.78, 0.06, 0.72, 0.78, '#2a2f3a', idx);
  // scherm
  box(base, 0, 0.88, 1.04, 0.07, 0.2, 0.07, '#2a2f3a', idx);
  box(base, 0, 1.17, 1.04, 0.74, 0.46, 0.05, '#20242e', idx);
  const scr = scrN; SCR.setMatrixAt(scrN, compose(base, 0, 1.17, 1.011, 0.68, 0.4, 0.012)); SCR.setColorAt(scrN++, C.set(SCREEN[a.state] || SCREEN.ok));
  box(base, 0, 0.79, 0.6, 0.44, 0.02, 0.15, '#2a2f3a', idx);
  if (h % 3 === 0) box(base, 0.55, 0.83, 0.62, 0.09, 0.11, 0.09, h % 2 ? '#ffffff' : deptColor, idx);
  if (h % 4 === 1) box(base, -0.52, 0.79, 0.7, 0.24, 0.02, 0.32, '#f4f4f0', idx);
  // stoel
  box(base, 0, 0.03, 0, 0.5, 0.05, 0.5, '#23272f', idx);
  box(base, 0, 0.23, 0, 0.08, 0.38, 0.08, '#23272f', idx);
  box(base, 0, 0.46, -0.02, 0.5, 0.08, 0.5, '#343a46', idx);
  box(base, 0, 0.82, -0.28, 0.5, 0.62, 0.07, '#343a46', idx);
  // poppetje (zit, kijkt naar +z)
  const skin = SKIN[h % SKIN.length], hair = HAIR[(h >> 3) % HAIR.length];
  const body = [];
  body.push(box(base, 0, 0.58, 0.16, 0.36, 0.16, 0.44, '#2c3140', idx));
  body.push(box(base, 0, 0.3, 0.36, 0.36, 0.42, 0.15, '#2c3140', idx));
  body.push(box(base, 0, 0.93, 0, 0.46, 0.52, 0.27, deptColor, idx));
  body.push(box(base, 0, 1.43, 0.02, 0.5, 0.46, 0.46, skin, idx));
  body.push(box(base, 0, 1.69, 0, 0.54, 0.14, 0.5, hair, idx));
  body.push(box(base, 0, 1.5, -0.22, 0.54, 0.36, 0.1, hair, idx));
  body.push(box(base, -0.11, 1.44, 0.255, 0.06, 0.08, 0.02, '#1a1a1e', idx));
  body.push(box(base, 0.11, 1.44, 0.255, 0.06, 0.08, 0.02, '#1a1a1e', idx));
  const armL = box(base, -0.29, 0.86, 0.3, 0.12, 0.12, 0.46, deptColor, idx);
  const armR = box(base, 0.29, 0.86, 0.3, 0.12, 0.12, 0.46, deptColor, idx);
  body.push(armL, armR);
  const mats = body.map((i) => { const m = new THREE.Matrix4(); BX.getMatrixAt(i, m); return m; });
  const head = new THREE.Vector3(0, 1.75, 0).applyMatrix4(base);
  return { a, idx, base, scr, body, mats, armL, armR, head, pos: new THREE.Vector3(x, 0, z), phase: (h % 100) / 100 * 6.28, shown: true };
}
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
function showBody(rt, on) {
  if (rt.shown === on) return; rt.shown = on;
  rt.body.forEach((i, k) => BX.setMatrixAt(i, on ? rt.mats[k] : ZERO));
  BX.instanceMatrix.needsUpdate = true;
}

/* ---------- meubels ---------- */
function plant(x, z, s) {
  s = s || 1;
  box(null, x, 0.2 * s, z, 0.42 * s, 0.4 * s, 0.42 * s, '#e9e4da');
  box(null, x, 0.75 * s, z, 0.1 * s, 0.7 * s, 0.1 * s, '#6b4a2f');
  box(null, x, 1.25 * s, z, 0.62 * s, 0.5 * s, 0.62 * s, '#3f9b4b');
  box(null, x + 0.2 * s, 1.65 * s, z - 0.1 * s, 0.44 * s, 0.4 * s, 0.44 * s, '#56b860');
  box(null, x - 0.18 * s, 1.55 * s, z + 0.16 * s, 0.36 * s, 0.34 * s, 0.36 * s, '#2f8140');
}
function cabinet(x, z, alongX) {
  const w = 1.7, d = 0.42, sx = alongX ? w : d, sz = alongX ? d : w;
  box(null, x, 0.95, z, sx, 1.9, sz, '#c9a676');
  const cols = ['#c8472f', '#2f6fd6', '#e9c349', '#3f9b4b', '#f2f2f2', '#7a4fb5'];
  for (let r = 0; r < 3; r++) for (let k = 0; k < 5; k++) {
    const o = -0.6 + k * 0.3, y = 0.45 + r * 0.55, col = cols[(k + r * 2) % cols.length];
    if (alongX) box(null, x + o, y, z + d / 2 + 0.01, 0.2, 0.34, 0.03, col); else box(null, x + d / 2 + 0.01, y, z + o, 0.03, 0.34, 0.2, col);
  }
}

/* ---------- gebouw ---------- */
function partition(xa, za, xb, zb, gap) {
  // glazen scheidingswand, h 2.3, met optioneel een deuropening in het midden
  const alongX = Math.abs(xb - xa) > Math.abs(zb - za);
  const len = alongX ? xb - xa : zb - za, t = 0.08, hh = 2.3;
  const segs = gap ? [[0, len / 2 - 0.9], [len / 2 + 0.9, len]] : [[0, len]];
  segs.forEach(([p, q]) => {
    const c = (p + q) / 2, l = q - p;

    + '<span class="pill" style="background:' + st[1] + '">' + esc(st[0]) + '</span>'
    + '<dl class="kv"><dt>Schema</dt><dd>' + esc(a.schedule_human || '—') + '</dd>'
    + '<dt>Laatste run</dt><dd>' + esc(fmt(a.last_run_at)) + (a.last_run_at ? (a.last_success === false ? ' · mislukt' : ' · gelukt') : '') + '</dd>'
    + '<dt>Resultaat</dt><dd>' + esc(a.last_summary || '—') + '</dd>'
    + '<dt>Runs 24 u</dt><dd>' + esc(a.runs_24h) + (Number(a.fails_24h) ? ' · ' + esc(a.fails_24h) + ' fout' : '') + '</dd>'
    + (s7 ? '<dt>Succes 7 d</dt><dd>' + esc(s7.pct_ok) + '% · ' + esc(s7.ok_7d) + '/' + esc(s7.runs_7d) + '</dd>' : '')
    + (Number(a.open_loops) ? '<dt>Open loops</dt><dd>' + esc(a.open_loops) + '</dd>' : '') + '</dl>'
    + '<h3>LAATSTE RUNS</h3><div id="side-runs"><div class="run">Laden…</div></div>'
    + '<div class="acts">' + (a.n8n_workflow_id && !DEMO ? '<a class="btn" target="_blank" rel="noopener" href="' + N8N + encodeURIComponent(a.n8n_workflow_id) + '">Open in n8n</a>' : '')
    + '<a class="btn" href="organisation.html?agent=' + encodeURIComponent(a.agent_id) + '">Organigram</a></div>';
  $('side-x').addEventListener('click', () => { sel = null; renderSide(); });
  const id = a.agent_id; runsFor = id;
  const job = DEMO ? Promise.resolve([{ run_at: a.last_run_at, status: a.last_success === false ? 'error' : 'success', summary: a.last_summary }])
    : rest('dewi_runs_public?select=run_at,status,summary&workflow=eq.' + encodeURIComponent(a.workflow_name) + '&order=run_at.desc&limit=8');
  job.then((rows) => {
    if (runsFor !== id || !$('side-runs')) return;
    $('side-runs').innerHTML = rows.length ? rows.map((r) => { const bad = r.status && r.status !== 'success' && r.status !== 'ok'; return '<div class="run' + (bad ? ' bad' : '') + '"><b>' + esc(fmt(r.run_at)) + (bad ? ' · mislukt' : '') + '</b><br>' + esc(r.summary || '') + '</div>'; }).join('') : '<div class="run">Nog geen runs.</div>';
  }).catch((e) => { if (runsFor === id && $('side-runs')) $('side-runs').innerHTML = '<div class="run">Runs laden mislukt (' + esc(e.message) + ').</div>'; });
}

/* ---------- lus ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
const PV = new THREE.Vector3();
function place(el, v, show) {
  if (!show) { if (el._on !== false) { el.style.display = 'none'; el._on = false; } return; }
  PV.copy(v).project(camera);
  if (PV.z > 1 || Math.abs(PV.x) > 1.1 || Math.abs(PV.y) > 1.1) { if (el._on !== false) { el.style.display = 'none'; el._on = false; } return; }
  if (el._on !== true) { el.style.display = ''; el._on = true; }
  el.style.transform = 'translate(-50%,-100%) translate(' + ((PV.x * 0.5 + 0.5) * stage.clientWidth).toFixed(1) + 'px,' + ((-PV.y * 0.5 + 0.5) * stage.clientHeight).toFixed(1) + 'px)';
}
let lastT = performance.now(), time = 0;
function frame() {
  const nowT = performance.now(), dt = Math.min((nowT - lastT) / 1000, 0.05); lastT = nowT; time += dt;
  if (fly) { fly.t = Math.min(1, fly.t + dt / 0.9); const e = fly.t * fly.t * (3 - 2 * fly.t); camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (fly.t >= 1) fly = null; }
  controls.update();
  if (root && agentsRt) {
    if (brain && !REDUCED) { brain.position.y = BRAIN_Y + Math.sin(time * 0.9) * 0.28; brain.rotation.y = time * 0.25; brainGlow.position.copy(brain.position); brainGlow.material.opacity = 0.8 + Math.sin(time * 2.1) * 0.15; plazaRing.material.opacity = 0.65 + Math.sin(time * 2.1) * 0.2; }
    if (!REDUCED) {
      // typen: armen wippen; sneller en hoger bij 'working'
      for (let i = 0; i < agentsRt.length; i++) {
        const rt = agentsRt[i]; if (!rt.shown) continue;
        const wk = rt.a.state === 'working', sp = wk ? 13 : 4.5, amp = wk ? 0.035 : 0.014;
        BX.setMatrixAt(rt.armL, compose(rt.base, -0.29, 0.86 + Math.max(0, Math.sin(time * sp + rt.phase)) * amp, 0.3, 0.12, 0.12, 0.46));
        BX.setMatrixAt(rt.armR, compose(rt.base, 0.29, 0.86 + Math.max(0, Math.sin(time * sp + rt.phase + 2.1)) * amp, 0.3, 0.12, 0.12, 0.46));
      }
      BX.instanceMatrix.needsUpdate = true;
    }
    ambient(dt); if (FB) stepFire(dt);
    rooms.forEach((r) => { r.anchor.y = focus === r ? 6.2 : 3.5; place(r.label, r.anchor, true); });
    for (let i = 0; i < agentsRt.length; i++) {
      const rt = agentsRt[i];
      const inFocus = focus && i >= focus.first && i < focus.first + focus.count;
      place(rt.label, rt.anchor, inFocus || rt === hover || rt === sel || rt.a.state === 'error');
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__office3 = { get agents() { return agentsRt; }, get rooms() { return rooms; }, focusRoom, goHome, burst, camera, controls };
refresh().then(() => { setInterval(refresh, 60000); });
requestAnimationFrame(frame);
</script>
